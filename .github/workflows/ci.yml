name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "*.md"
      - "crates/dskcopy-web/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "*.md"
      - "crates/dskcopy-web/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libfontconfig1-dev

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features gui -- -D warnings

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --workspace --verbose

      - name: Build CLI
        run: cargo build --release -p dskcopy --bin dskcopy-cli --target ${{ matrix.target }}

      - name: Build GUI
        if: ${{ !matrix.cross }}
        run: cargo build --release -p dskcopy --features gui --bin dskcopy-gui --target ${{ matrix.target }}
