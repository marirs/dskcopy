[package]
name = "dskcopy-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
flate2 = "1"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
reqwest = { version = "0.12", features = ["blocking"] }
byteorder = "1"
plist = "1"
bzip2 = "0.4"
gpt = "3"
fatfs = "0.3"
rust-embed = { version = "8", features = ["debug-embed"] }
glob = "0.3"
